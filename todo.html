<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal To-Do List Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 15px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        header h1 { margin: 0; color: #333; font-size: 24px; }
        #logout-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        #logout-btn:hover { background: #e84118; }

        .task-form-container {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .task-form-container h3 { margin-top: 0; color: #444; }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        input, textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
        }
        textarea { grid-column: span 2; resize: none; height: 60px; }
        #add-task-btn {
            grid-column: span 2;
            background: #2ed573;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        #add-task-btn:hover { background: #26af5f; }

        .sections-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .sections-wrapper { grid-template-columns: 1fr; }
            textarea, #add-task-btn { grid-column: span 1; }
        }
        .section {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            min-height: 300px;
        }
        .section h2 { border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 20px; color: #555; }
        
        .task-card {
            background: #fff;
            border: 1px solid #e1e1e1;
            border-left: 5px solid #667eea;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: transform 0.2s;
        }
        .task-card.completed {
            border-left-color: #2ed573;
            background: #f9fffb;
            opacity: 0.85;
        }
        .task-title { font-weight: bold; font-size: 18px; color: #333; margin-bottom: 5px; }
        .task-info { font-size: 13px; color: #777; margin-bottom: 8px; }
        .task-note { font-size: 14px; color: #555; margin-bottom: 12px; background: #f8f9fa; padding: 8px; border-radius: 5px; }
        
        .task-actions {
            display: flex;
            gap: 10px;
        }
        .task-actions button {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .btn-toggle { background: #ffa502; color: white; }
        .btn-edit { background: #3742fa; color: white; }
        .btn-delete { background: #ff4757; color: white; }
    </style>
</head>
<body>

    <header>
        <h1 id="welcome-user">Welcome, </h1>
        <button id="logout-btn">Logout</button>
    </header>

    <!-- Task Form Container -->
    <div class="task-form-container">
        <h3 id="form-mode-title">Add New Task</h3>
        <div class="form-grid">
            <input type="text" id="task-name" placeholder="Task Name" required>
            <input type="date" id="task-date" required>
            <input type="time" id="task-time" required>
            <textarea id="task-note" placeholder="Additional Notes..."></textarea>
            <button id="add-task-btn">Add Task</button>
        </div>
    </div>

    <!-- Tasks Display Sections -->
    <div class="sections-wrapper">
        <!-- Pending Tasks -->
        <div class="section">
            <h2>Pending ⏳</h2>
            <div id="pending-list"></div>
        </div>
        <!-- Completed Tasks -->
        <div class="section">
            <h2>Completed ✅</h2>
            <div id="completed-list"></div>
        </div>
    </div>

    <script>

        let username = localStorage.getItem("app_name") || "User";
        document.getElementById("welcome-user").textContent = `Welcome, ${username}`;

        document.getElementById("logout-btn").addEventListener("click", () => {
            localStorage.removeItem("isLoggedIn");
            window.location.href = "index.html";
        });

        let currentUserEmail = localStorage.getItem("app_user") || "default_user";
        let tasksStorageKey = "tasks_" + currentUserEmail;

        let tasks = JSON.parse(localStorage.getItem(tasksStorageKey)) || [];
        let editIndex = null;

        let taskNameInput = document.getElementById("task-name");
        let taskDateInput = document.getElementById("task-date");
        let taskTimeInput = document.getElementById("task-time");
        let taskNoteInput = document.getElementById("task-note");
        let addTaskBtn = document.getElementById("add-task-btn");
        let formModeTitle = document.getElementById("form-mode-title");

        let pendingList = document.getElementById("pending-list");
        let completedList = document.getElementById("completed-list");

        function renderTasks() {
            pendingList.innerHTML = "";
            completedList.innerHTML = "";

            tasks.forEach((task, index) => {
                let card = document.createElement("div");
                card.className = `task-card ${task.completed ? "completed" : ""}`;

                card.innerHTML = `
                    <div class="task-title">${task.name}</div>
                    <div class="task-info">📅 ${task.date} &nbsp;|&nbsp; ⏰ ${task.time}</div>
                    ${task.note ? `<div class="task-note">${task.note}</div>` : ""}
                    <div class="task-actions">
                        <button class="btn-toggle" onclick="toggleTask(${index})">${task.completed ? "Mark Pending" : "Complete"}</button>
                        <button class="btn-edit" onclick="editTask(${index})">Edit</button>
                        <button class="btn-delete" onclick="deleteTask(${index})">Delete</button>
                    </div>
                `;

                if (task.completed) {
                    completedList.appendChild(card);
                } else {
                    pendingList.appendChild(card);
                }
            });

            // حفظ المهام في المفتاح الخاص بالمستخدم الحالي حصراً
            localStorage.setItem(tasksStorageKey, JSON.stringify(tasks));
        }

        addTaskBtn.addEventListener("click", () => {
            let name = taskNameInput.value.trim();
            let date = taskDateInput.value;
            let time = taskTimeInput.value;
            let note = taskNoteInput.value.trim();

            if (!name || !date || !time) {
                alert("Please fill in all required fields (Task Name, Date, and Time)!");
                return;
            }

            if (editIndex === null) {
                tasks.push({ name, date, time, note, completed: false });
            } else {
                tasks[editIndex].name = name;
                tasks[editIndex].date = date;
                tasks[editIndex].time = time;
                tasks[editIndex].note = note;
                editIndex = null;
                addTaskBtn.textContent = "Add Task";
                formModeTitle.textContent = "Add New Task";
            }

            taskNameInput.value = "";
            taskDateInput.value = "";
            taskTimeInput.value = "";
            taskNoteInput.value = "";

            renderTasks();
        });

        window.toggleTask = function(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        };

        window.deleteTask = function(index) {
            tasks.splice(index, 1);
            if (editIndex === index) {
                editIndex = null;
                addTaskBtn.textContent = "Add Task";
                formModeTitle.textContent = "Add New Task";
                taskNameInput.value = "";
                taskDateInput.value = "";
                taskTimeInput.value = "";
                taskNoteInput.value = "";
            }
            renderTasks();
        };

        window.editTask = function(index) {
            let task = tasks[index];
            taskNameInput.value = task.name;
            taskDateInput.value = task.date;
            taskTimeInput.value = task.time;
            taskNoteInput.value = task.note;

            editIndex = index;
            addTaskBtn.textContent = "Update Task";
            formModeTitle.textContent = "Edit Current Task";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        
        renderTasks();
    </script>

</body>
</html>
